<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAP LIFE</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0B10; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0 0 10px; color: #ffb800; }
  p { margin: 0 0 18px; color: #9aa0ad; font-size: 14px; line-height: 1.5; max-width: 420px; }
  button { height: 44px; padding: 0 28px; border: 0; border-radius: 12px; background: #ffb800; color: #000; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
  <div>
    <h1>Can’t reach the game</h1>
    <p>Check your internet connection. If the game server was asleep, it can take up to a minute to wake up. Then try again.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Try again</button>
  </div>
</body>
</html>
