<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAP LIFE</title>
<style>
  html, body { margin: 0; height: 100%; background: #0A0B10; color: #fff; font-family: system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0 0 10px; color: #ffb800; }
  p { margin: 0 0 18px; color: #9aa0ad; font-size: 14px; line-height: 1.5; max-width: 420px; }
  button { height: 44px; padding: 0 28px; border: 0; border-radius: 12px; background: #ffb800; color: #000; font-weight: 700; font-size: 15px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ffb800; margin: 0 3px; animation: b 1s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: .15s } .dot:nth-child(3) { animation-delay: .3s }
  @keyframes b { 0%,80%,100% { opacity: .2 } 40% { opacity: 1 } }
</style>
</head>
<body>
  <div>
    <h1 id="t">Waking the game up</h1>
    <p id="m">The game server sleeps when nobody is playing. It can take up to a minute to wake. This page keeps trying by itself.</p>
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <p style="margin-top:18px"><button id="b">Try now</button></p>
  </div>
<script>
  // __GAME_URL__ is filled in when the app is built (android-app/scripts/setup.mjs).
  var GAME = '__GAME_URL__';
  var tries = 0;
  function go() { location.replace(GAME); }
  function probe() {
    tries++;
    fetch(GAME + '/api/health', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { go(); })
      .catch(function () {
        if (tries > 8) { document.getElementById('t').textContent = "Can\u2019t reach the game"; document.getElementById('m').textContent = 'Check your internet connection. This page keeps trying.'; }
        setTimeout(probe, 4000);
      });
  }
  document.getElementById('b').onclick = go;
  if (GAME.indexOf('http') === 0) probe();
</script>
</body>
</html>
