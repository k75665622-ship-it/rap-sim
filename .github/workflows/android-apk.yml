name: Android app (APK)

# Builds the RAP LIFE Android app in GitHub's cloud: no Android Studio, nothing to install.
# Run it by hand: Actions tab -> "Android app (APK)" -> Run workflow. See android-app/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # only used to publish the download link (main branch / manual runs)

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        env:
          GAME_URL: ${{ vars.GAME_URL }}
        run: node scripts/setup.mjs

      - name: Build the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KS_B64" ]; then
            echo "Building a release APK signed with your permanent key"
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/raplife.keystore"
            ./gradlew --no-daemon assembleRelease
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -1)"
            "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/raplife.keystore" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out ../RapLife.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../RapLife.apk
            echo "SIGNING=your permanent key" >> "$GITHUB_ENV"
          else
            echo "No signing key set: building a debug APK (see README, 'Permanent signing key')"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../RapLife.apk
            echo "SIGNING=a temporary debug key (set up a permanent key before sharing widely)" >> "$GITHUB_ENV"
          fi
          ls -lh ../RapLife.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RapLife-apk
          path: android-app/RapLife.apk
          if-no-files-found: error

      - name: Publish the download link (main branch or manual run, with the game address set)
        if: github.event_name != 'pull_request' && env.GAME_URL_OK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest RapLife.apk \
            --target "$GITHUB_SHA" \
            --title "RAP LIFE for Android (latest)" \
            --notes "Android app build ${APP_VERSION_CODE}. Signed with ${SIGNING}. Install: download RapLife.apk on your phone, open it, and allow installs from this source when Android asks."

      - name: Summary
        run: |
          {
            echo "### RAP LIFE Android build ${APP_VERSION_CODE}"
            echo "- Game address set: **${GAME_URL_OK}**"
            echo "- Signed with: ${SIGNING}"
            if [ "${GAME_URL_OK}" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- Download: https://github.com/${{ github.repository }}/releases/download/android-latest/RapLife.apk"
            elif [ "${GAME_URL_OK}" != "true" ]; then
              echo "- **Set the GAME_URL variable (README step 1), then run this again.** This build points at a placeholder address."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
